# docker-compose.yml for local development
version: "3.9"
services:
  backend:
    build: .
    container_name: homebrew_backend
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
    depends_on:
      - db
  db:
    image: sqlite3
    # SQLite is file‑based; we mount the current directory so the file persists
    volumes:
      - ./homebrew.db:/data/homebrew.db
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    # Dummy container to keep the volume; actual DB is accessed directly via file path
  frontend:
    image: node:20-alpine
    container_name: homebrew_frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
