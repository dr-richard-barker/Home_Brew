  <style>
    :root {
      --cose-navy: #1a365d;
      --cose-navy-dark: #0f2342;
      --cose-teal: #0f766e;
      --cose-teal-light: #f0fdfa;
      --cose-bg: #f4f6f9;
      --cose-surface: #ffffff;
      --cose-border: #e2e8f0;
      --cose-text: #1e293b;
      --cose-muted: #64748b;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--cose-bg);
      color: var(--cose-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .cose-header {
      background: linear-gradient(135deg, #0f2342 0%, #1a365d 60%, #115e59 100%);
      color: #fff;
      padding: 16px 28px;
      border-bottom: 3px solid #0d9488;
      box-shadow: 0 2px 10px rgba(15, 35, 66, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .cose-container {
      max-width: 1560px;
      margin: 0 auto;
      padding: 24px 28px;
    }
    .cose-grid {
      display: grid;
      grid-template-columns: minmax(520px, 1.15fr) minmax(460px, 1fr);
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1080px) {
      .cose-grid {
        grid-template-columns: 1fr;
      }
    }
    .cose-card {
      background: var(--cose-surface);
      border: 1px solid var(--cose-border);
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .cose-section-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--cose-border);
      background: #f8fafc;
      border-radius: 6px 6px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cose-stat-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid var(--cose-teal);
      border-radius: 6px;
      padding: 12px 16px;
    }
    .cose-stat-box.navy {
      border-left-color: var(--cose-navy);
    }
    .cose-stat-box.amber {
      border-left-color: #d97706;
    }
    .srm-swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0,0,0,0.2);
      vertical-align: middle;
      margin-right: 6px;
    }
    .checked-row {
      opacity: 0.48;
      text-decoration: line-through;
      background-color: #f8fafc;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .cose-container {
        padding: 0;
      }
      .cose-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script type="text/babel">

    // CoSE (Collaborative Science Environment) Ant Design Theme Tokens

    const SYNONYM_MAP = {
      "us - pale 2-row": "American - Pale 2-Row",
      "american 2-row": "American - Pale 2-Row",
      "two-row pale malt": "American - Pale 2-Row",
      "crystal 80l": "American - Caramel / Crystal 80L",

      "wyeast 1318 - london ale iii": "Wyeast - London Ale III 1318"
    };

    function normalizeName(name) {
      if (!name) return "Unknown";
      const cleaned = name.trim().replace(/\s+/g, " ");
      const lower = cleaned.toLowerCase();
      return SYNONYM_MAP[lower] || cleaned;
    }

    // Client-side multi-recipe scaling & ordering list builder (works identically on GitHub Pages and Flask)
    function computeOrderingList(recipes, selectedIds, customVolumes, defaultVol) {
      const maltsMap = {};
      const hopsMap = {};
      const yeastsMap = {};
      const othersMap = {};
      const scaledRecipes = [];

      selectedIds.forEach((id) => {
        const r = recipes.find((item) => item.id === id);
        if (!r) return;
        const targetVol = customVolumes[id] !== undefined ? Number(customVolumes[id]) : Number(defaultVol);
        const origVol = r.original_volume_gal && r.original_volume_gal > 0 ? r.original_volume_gal : 5.0;
        const factor = targetVol / origVol;

        scaledRecipes.push({
          ...r,
          target_volume_gal: Number(targetVol.toFixed(2)),
          scale_factor: Number(factor.toFixed(3))
        });

        // 1. Malts
        (r.malts || []).forEach((m) => {
          const normName = normalizeName(m.name);
          const key = normName.toLowerCase();
          const baseLb = m.original_amount_lb !== undefined ? m.original_amount_lb : m.amount_lb;
          const scaledLb = baseLb * factor;
          const scaledKg = scaledLb * 0.453592;
          if (!maltsMap[key]) {
            maltsMap[key] = {
              name: normName,
              total_lb: 0,
              total_kg: 0,
              color_srm: m.color_srm ?? null,
              used_in: []
            };
          }
          maltsMap[key].total_lb += scaledLb;
          maltsMap[key].total_kg += scaledKg;
          if (maltsMap[key].color_srm === null && m.color_srm != null) {
            maltsMap[key].color_srm = m.color_srm;
          }
          maltsMap[key].used_in.push({
            recipe_id: r.id,
            recipe_name: r.name,
            amount_lb: Number(scaledLb.toFixed(2)),
            target_volume_gal: targetVol
          });
        });

        // 2. Hops (combine same hop variety within recipe first)
        const recipeHopTotals = {};
        const recipeHopAA = {};
        const recipeHopName = {};
        (r.hops || []).forEach((h) => {
          const normName = normalizeName(h.name);
          const key = normName.toLowerCase();
          const baseOz = h.original_amount_oz !== undefined ? h.original_amount_oz : h.amount_oz;
          const scaledOz = baseOz * factor;
          recipeHopName[key] = normName;
          recipeHopTotals[key] = (recipeHopTotals[key] || 0) + scaledOz;
          if (h.alpha_acid != null) recipeHopAA[key] = h.alpha_acid;
        });

        Object.keys(recipeHopTotals).forEach((key) => {
          const ozSum = recipeHopTotals[key];
          if (!hopsMap[key]) {
            hopsMap[key] = {
              name: recipeHopName[key],
              total_oz: 0,
              total_g: 0,
              alpha_acid: recipeHopAA[key] ?? null,
              used_in: []
            };
          }
          hopsMap[key].total_oz += ozSum;
          hopsMap[key].total_g += ozSum * 28.3495;
          if (hopsMap[key].alpha_acid === null && recipeHopAA[key] != null) {
            hopsMap[key].alpha_acid = recipeHopAA[key];
          }
          hopsMap[key].used_in.push({
            recipe_id: r.id,
            recipe_name: r.name,
            amount_oz: Number(ozSum.toFixed(2)),
            target_volume_gal: targetVol
          });
        });

        // 3. Yeasts
        (r.yeasts || []).forEach((y) => {
          const normStrain = normalizeName(y.strain_name);
          const key = normStrain.toLowerCase();
          const packs = Math.max(1, Math.round(factor));
          if (!yeastsMap[key]) {
            yeastsMap[key] = {
              strain_name: normStrain,
              total_packs: 0,
              attenuation_pct: y.attenuation_pct ?? null,
              used_in: []
            };
          }
          yeastsMap[key].total_packs += packs;
          if (yeastsMap[key].attenuation_pct === null && y.attenuation_pct != null) {
            yeastsMap[key].attenuation_pct = y.attenuation_pct;
          }
          yeastsMap[key].used_in.push({
            recipe_id: r.id,
            recipe_name: r.name,
            packs,
            target_volume_gal: targetVol
          });
        });

        // 4. Others
        (r.others || []).forEach((o) => {
          const normName = normalizeName(o.name);
          const unit = o.unit || 'unit';
          const key = `${normName.toLowerCase()}__${unit.toLowerCase()}`;
          const baseAmt = o.original_amount !== undefined ? o.original_amount : o.amount;
          const scaledAmt = baseAmt * factor;
          if (!othersMap[key]) {
            othersMap[key] = {
              name: normName,
              total_amount: 0,
              unit,
              type: o.type || 'Additive',
              used_in: []
            };
          }
          othersMap[key].total_amount += scaledAmt;
          othersMap[key].used_in.push({
            recipe_id: r.id,
            recipe_name: r.name,
            amount: Number(scaledAmt.toFixed(2)),
            unit,
            target_volume_gal: targetVol
          });
        });
      });

      const maltsList = Object.values(maltsMap)
        .map((m) => ({
          ...m,
          total_lb: Number(m.total_lb.toFixed(2)),
          total_kg: Number(m.total_kg.toFixed(2))
        }))
        .sort((a, b) => b.total_lb - a.total_lb);

      const hopsList = Object.values(hopsMap)
        .map((h) => ({
          ...h,
          total_oz: Number(h.total_oz.toFixed(2)),
          total_g: Number(h.total_g.toFixed(1))
        }))
        .sort((a, b) => b.total_oz - a.total_oz);

      const yeastsList = Object.values(yeastsMap).sort((a, b) => b.total_packs - a.total_packs);

      const othersList = Object.values(othersMap)
        .map((o) => ({
          ...o,
          total_amount: Number(o.total_amount.toFixed(2))
        }))
        .sort((a, b) => a.name.localeCompare(b.name));

      const totalGrainLb = Number(maltsList.reduce((s, m) => s + m.total_lb, 0).toFixed(2));
      const totalHopsOz = Number(hopsList.reduce((s, h) => s + h.total_oz, 0).toFixed(2));
      const totalYeastPacks = yeastsList.reduce((s, y) => s + y.total_packs, 0);
      const totalBatchVol = Number(scaledRecipes.reduce((s, r) => s + r.target_volume_gal, 0).toFixed(2));

      return {
        summary: {
          selected_recipe_count: scaledRecipes.length,
          total_batch_volume_gal: totalBatchVol,
          total_grain_lb: totalGrainLb,
          total_grain_kg: Number((totalGrainLb * 0.453592).toFixed(2)),
          total_hops_oz: totalHopsOz,
          total_hops_g: Number((totalHopsOz * 28.3495).toFixed(1)),
          total_yeast_packs: totalYeastPacks
        },
        ordering_list: {
          malts: maltsList,
          hops: hopsList,
          yeasts: yeastsList,
          others: othersList
        },
        recipes: scaledRecipes
      };
    }

    function srmToHex(srm) {
      if (!srm || srm <= 2) return '#F8F753';
      if (srm <= 4) return '#F6F513';
      if (srm <= 6) return '#ECE61A';
      if (srm <= 8) return '#D5BC26';
      if (srm <= 10) return '#BF923B';
      if (srm <= 13) return '#BF813A';
      if (srm <= 17) return '#BC6733';
      if (srm <= 20) return '#8D4C32';
      if (srm <= 24) return '#5D341A';
      if (srm <= 30) return '#361F1B';
      return '#1F1210';
    }

    function App() {
      const [recipes, setRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [styleFilter, setStyleFilter] = useState('ALL');
      const [globalVolumeGal, setGlobalVolumeGal] = useState(5.0);
      const [unitSystem, setUnitSystem] = useState('IMPERIAL');
      const [selectedRowKeys, setSelectedRowKeys] = useState([]);
      const [customVolumes, setCustomVolumes] = useState({});
      const [checkedItems, setCheckedItems] = useState({});
      const [hideChecked, setHideChecked] = useState(false);
      const [activeRecipe, setActiveRecipe] = useState(null);
      const [addModalOpen, setAddModalOpen] = useState(false);
      const [form] = Form.useForm();

      // Load recipes (from embedded data, ./recipes.json on GitHub Pages, or /api/recipes on Flask)
      useEffect(() => {
        async function loadData() {
          setLoading(true);
          let loaded = null;

          // 1. Check embedded recipes first for instant GitHub Pages startup
          if (window.EMBEDDED_RECIPES && Array.isArray(window.EMBEDDED_RECIPES)) {
            loaded = window.EMBEDDED_RECIPES;
          }

          // 2. Try /api/recipes (Flask backend) or ./recipes.json (GitHub Pages static file)
          if (!loaded) {
            try {
              const rApi = await fetch('/api/recipes?volume=5');
              if (rApi.ok) loaded = await rApi.json();
            } catch (_) {}
          }
          if (!loaded) {
            try {
              const rStatic = await fetch('./recipes.json');
              if (rStatic.ok) loaded = await rStatic.json();
            } catch (_) {}
          }

          // Merge any user-created custom recipes from localStorage
          try {
            const localCustom = JSON.parse(localStorage.getItem('cose_custom_recipes') || '[]');
            if (Array.isArray(localCustom) && localCustom.length > 0 && loaded) {
              loaded = [...loaded, ...localCustom];
            }
          } catch (_) {}

          if (loaded && loaded.length > 0) {
            setRecipes(loaded);

            // Check URL query params for shared selection (?recipes=7,8&vol=5)
            const params = new URLSearchParams(window.location.search);
            const sharedVol = parseFloat(params.get('vol'));
            if (!isNaN(sharedVol) && sharedVol > 0) {
              setGlobalVolumeGal(sharedVol);
            }
            const sharedIds = params.get('recipes');
            if (sharedIds) {
              const parsedIds = sharedIds
                .split(',')
                .map((x) => parseInt(x.trim(), 10))
                .filter((id) => loaded.some((r) => r.id === id));
              if (parsedIds.length > 0) {
                setSelectedRowKeys(parsedIds);
              }
            } else if (loaded.length >= 2) {
              setSelectedRowKeys([loaded[0].id, loaded[1].id]);
            }
          }
          setLoading(false);
        }
        loadData();
      }, []);

      const handleGlobalVolumeChange = (newVol) => {
        const val = Number(newVol) || 5.0;
        setGlobalVolumeGal(val);
        setCustomVolumes({});
      };

      // Compute ordering list dynamically (instant client-side calculation!)
      const orderingData = useMemo(() => {
        if (selectedRowKeys.length === 0 || recipes.length === 0) return null;
        return computeOrderingList(recipes, selectedRowKeys, customVolumes, globalVolumeGal);
      }, [recipes, selectedRowKeys, customVolumes, globalVolumeGal]);

      // Unique beer styles
      const stylesList = useMemo(() => {
        const s = new Set();
        recipes.forEach((r) => {
          if (r.style) s.add(r.style);
        });
        return ['ALL', ...Array.from(s).sort()];
      }, [recipes]);

      // Filtered recipes
      const filteredRecipes = useMemo(() => {
        return recipes.filter((r) => {
          const matchesStyle = styleFilter === 'ALL' || r.style === styleFilter;
          if (!matchesStyle) return false;
          if (!searchQuery.trim()) return true;
          const q = searchQuery.toLowerCase();
          return (
            r.name.toLowerCase().includes(q) ||
            (r.style || '').toLowerCase().includes(q) ||
            (r.malts || []).some((m) => m.name.toLowerCase().includes(q)) ||
            (r.hops || []).some((h) => h.name.toLowerCase().includes(q)) ||
            (r.yeasts || []).some((y) => y.strain_name.toLowerCase().includes(q))
          );
        });
      }, [recipes, styleFilter, searchQuery]);

      const toggleCheckItem = (key) => {
        setCheckedItems((prev) => ({ ...prev, [key]: !prev[key] }));
      };

      // Normalize all stored recipes to current globalVolumeGal
      const handleNormalizeAllToTarget = async () => {
        const target = globalVolumeGal;
        const updated = recipes.map((r) => {
          const orig = r.original_volume_gal || 5.0;
          const factor = target / orig;
          return {
            ...r,
            original_volume_gal: Number(target.toFixed(2)),
            malts: (r.malts || []).map((m) => {
              const baseLb = m.original_amount_lb !== undefined ? m.original_amount_lb : m.amount_lb;
              const newLb = Number((baseLb * factor).toFixed(3));
              return { ...m, original_amount_lb: newLb, amount_lb: newLb };
            }),
            hops: (r.hops || []).map((h) => {
              const baseOz = h.original_amount_oz !== undefined ? h.original_amount_oz : h.amount_oz;
              const newOz = Number((baseOz * factor).toFixed(3));
              return { ...h, original_amount_oz: newOz, amount_oz: newOz };
            }),
            others: (r.others || []).map((o) => {
              const baseAmt = o.original_amount !== undefined ? o.original_amount : o.amount;
              const newAmt = Number((baseAmt * factor).toFixed(3));
              return { ...o, original_amount: newAmt, amount: newAmt };
            })
          };
        });
        setRecipes(updated);
        setCustomVolumes({});
        // Also call Flask backend if running locally
        try {
          await fetch('/api/recipes/normalize-all', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target_volume_gal: target })
          });
        } catch (_) {}
        message.success(`Normalized all ${updated.length} recipes to ${target} gal baseline!`);
      };

      // Shareable URL generator
      const handleShareLink = () => {
        const url = new URL(window.location.href);
        url.searchParams.set('vol', globalVolumeGal);
        if (selectedRowKeys.length > 0) {
          url.searchParams.set('recipes', selectedRowKeys.join(','));
        } else {
          url.searchParams.delete('recipes');
        }
        window.history.replaceState({}, '', url.toString());
        navigator.clipboard.writeText(url.toString());
        message.success('Shareable link with your selected recipes & batch volume copied to clipboard!');
      };

      // Export CSV
      const handleExportCSV = () => {
        if (!orderingData) return;
        const rows = [
          ['Category', 'Ingredient Name', 'Total Amount (US)', 'Unit (US)', 'Total Amount (Metric)', 'Unit (Metric)', 'Used In Recipes']
        ];
        orderingData.ordering_list.malts.forEach((m) => {
          if (hideChecked && checkedItems[`malt-${m.name}`]) return;
          const used = m.used_in.map((u) => `${u.recipe_name} (${u.amount_lb} lb)`).join('; ');
          rows.push(['Fermentable / Malt', m.name, m.total_lb, 'lb', m.total_kg, 'kg', used]);
        });
        orderingData.ordering_list.hops.forEach((h) => {
          if (hideChecked && checkedItems[`hop-${h.name}`]) return;
          const used = h.used_in.map((u) => `${u.recipe_name} (${u.amount_oz} oz)`).join('; ');
          rows.push(['Hop', h.name, h.total_oz, 'oz', h.total_g, 'g', used]);
        });
        orderingData.ordering_list.yeasts.forEach((y) => {
          if (hideChecked && checkedItems[`yeast-${y.strain_name}`]) return;
          const used = y.used_in.map((u) => `${u.recipe_name} (${u.packs} pk)`).join('; ');
          rows.push(['Yeast', y.strain_name, y.total_packs, 'packs', y.total_packs, 'packs', used]);
        });
        orderingData.ordering_list.others.forEach((o) => {
          if (hideChecked && checkedItems[`other-${o.name}`]) return;
          const used = o.used_in.map((u) => `${u.recipe_name} (${u.amount} ${u.unit})`).join('; ');
          rows.push(['Other / Fining', o.name, o.total_amount, o.unit, o.total_amount, o.unit, used]);
        });

        const csvContent = rows
          .map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
          .join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `homebrew_ordering_list_${globalVolumeGal}gal.csv`;
        a.click();
        URL.revokeObjectURL(url);
        message.success('Downloaded CSV ingredient ordering list!');
      };

      // Copy formatted shopping list to clipboard
      const handleCopyOrderList = () => {
        if (!orderingData) return;
        const lines = [];
        lines.push(`=== COSE BREWLAB INGREDIENT ORDERING LIST ===`);
        lines.push(`Selected Recipes (${orderingData.summary.selected_recipe_count}):`);
        orderingData.recipes.forEach((r) => {
          lines.push(`  • ${r.name} — Target Batch: ${r.target_volume_gal} gal (Scale: ${r.scale_factor}x from ${r.original_volume_gal} gal)`);
        });
        lines.push('');
        lines.push(`--- 1. FERMENTABLES / MALTS (Total: ${orderingData.summary.total_grain_lb} lb / ${orderingData.summary.total_grain_kg} kg) ---`);
        orderingData.ordering_list.malts.forEach((m) => {
          if (hideChecked && checkedItems[`malt-${m.name}`]) return;
          const mark = checkedItems[`malt-${m.name}`] ? '[x]' : '[ ]';
          lines.push(`  ${mark} ${m.name}: ${m.total_lb} lb (${m.total_kg} kg)`);
        });
        lines.push('');
        lines.push(`--- 2. HOPS (Total: ${orderingData.summary.total_hops_oz} oz / ${orderingData.summary.total_hops_g} g) ---`);
        orderingData.ordering_list.hops.forEach((h) => {
          if (hideChecked && checkedItems[`hop-${h.name}`]) return;
          const mark = checkedItems[`hop-${h.name}`] ? '[x]' : '[ ]';
          lines.push(`  ${mark} ${h.name}: ${h.total_oz} oz (${h.total_g} g)`);
        });
        lines.push('');
        lines.push(`--- 3. YEAST STRAINS (Total: ${orderingData.summary.total_yeast_packs} packs) ---`);
        orderingData.ordering_list.yeasts.forEach((y) => {
          if (hideChecked && checkedItems[`yeast-${y.strain_name}`]) return;
          const mark = checkedItems[`yeast-${y.strain_name}`] ? '[x]' : '[ ]';
          lines.push(`  ${mark} ${y.strain_name}: ${y.total_packs} pack(s)`);
        });
        if (orderingData.ordering_list.others.length > 0) {
          lines.push('');
          lines.push(`--- 4. OTHER / FININGS / ADJUNCTS ---`);
          orderingData.ordering_list.others.forEach((o) => {
            if (hideChecked && checkedItems[`other-${o.name}`]) return;
            const mark = checkedItems[`other-${o.name}`] ? '[x]' : '[ ]';
            lines.push(`  ${mark} ${o.name}: ${o.total_amount} ${o.unit}`);
          });
        }
        navigator.clipboard.writeText(lines.join('\n'));
        message.success('Ordering list copied to clipboard!');
      };

      // Add a new custom recipe
      const handleAddCustomRecipe = (values) => {
        const newId = Math.max(0, ...recipes.map((r) => r.id)) + 1;
        const malts = (values.malts_text || '')
          .split('\n')
          .map((line, idx) => {
            const parts = line.split(',').map((s) => s.trim());
            if (!parts[0]) return null;
            const lb = parseFloat(parts[1]) || 1.0;
            return {
              id: newId * 100 + idx,
              name: parts[0],
              original_amount_lb: lb,
              amount_lb: lb,
              color_srm: parseFloat(parts[2]) || 2.0
            };
          })
          .filter(Boolean);

        const hops = (values.hops_text || '')
          .split('\n')
          .map((line, idx) => {
            const parts = line.split(',').map((s) => s.trim());
            if (!parts[0]) return null;
            const oz = parseFloat(parts[1]) || 1.0;
            return {
              id: newId * 100 + idx,
              name: parts[0],
              original_amount_oz: oz,
              amount_oz: oz,
              use: parts[2] || 'Boil',
              time_display: parts[3] || '60 min',
              alpha_acid: parseFloat(parts[4]) || 10.0
            };
          })
          .filter(Boolean);

        const newRecipe = {
          id: newId,
          name: values.name,
          style: values.style || 'All Grain',
          original_volume_gal: Number(values.original_volume_gal || 5.0),
          target_abv: values.abv ? Number(values.abv) : null,
          color_srm: values.srm ? Number(values.srm) : 5.0,
          malts,
          hops,
          yeasts: [
            {
              id: newId * 100,
              strain_name: values.yeast || 'SafAle US-05',
              attenuation_pct: 78,
              amount_units: '1 pack'
            }
          ],
          others: []
        };

        const updated = [...recipes, newRecipe];
        setRecipes(updated);
        setSelectedRowKeys((prev) => [...prev, newId]);
        try {
          const existingCustom = JSON.parse(localStorage.getItem('cose_custom_recipes') || '[]');
          localStorage.setItem('cose_custom_recipes', JSON.stringify([...existingCustom, newRecipe]));
        } catch (_) {}
        setAddModalOpen(false);
        form.resetFields();
        message.success(`Added "${newRecipe.name}" and selected it for ordering!`);
      };

      const recipeColumns = [
        {
          title: 'Recipe & Style',
          key: 'name',
          render: (_, record) => (
            <div>
              <div
                style={{ fontWeight: 600, fontSize: 15, color: '#0f2342', cursor: 'pointer' }}
                onClick={() => setActiveRecipe(record)}
              >
                {record.name}
              </div>
              <div style={{ marginTop: 4, display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                <Tag color="cyan" style={{ margin: 0 }}>{record.style || 'All Grain'}</Tag>
                {record.color_srm && (
                  <span style={{ fontSize: 12, color: '#64748b' }}>
                    <span className="srm-swatch" style={{ backgroundColor: srmToHex(record.color_srm) }} />
                    {record.color_srm} SRM
                  </span>
                )}
                {record.target_abv && (
                  <span className="mono" style={{ fontSize: 12, color: '#0f766e', fontWeight: 600 }}>
                    {record.target_abv}% ABV
                  </span>
                )}
              </div>
            </div>
          )
        },
        {
          title: 'Source Batch',
          dataIndex: 'original_volume_gal',
          key: 'original_volume_gal',
          width: 110,
          render: (val) => (
            <span className="mono" style={{ color: '#64748b', fontSize: 13 }}>
              {unitSystem === 'IMPERIAL' ? `${val} gal` : `${(val * 3.78541).toFixed(1)} L`}
            </span>
          )
        },
        {
          title: 'Target Volume',
          key: 'target_vol',
          width: 150,
          render: (_, record) => {
            const currentVol = customVolumes[record.id] !== undefined ? customVolumes[record.id] : globalVolumeGal;
            const factor = (currentVol / (record.original_volume_gal || 5.0)).toFixed(2);
            return (
              <div>
                <InputNumber
                  size="small"
                  min={0.5}
                  max={100}
                  step={0.5}
                  value={currentVol}
                  addonAfter="gal"
                  style={{ width: 110 }}
                  onChange={(val) => {
                    if (val && val > 0) {
                      setCustomVolumes((prev) => ({ ...prev, [record.id]: val }));
                      if (!selectedRowKeys.includes(record.id)) {
                        setSelectedRowKeys((prev) => [...prev, record.id]);
                      }
                    }
                  }}
                />
                <div className="mono" style={{ fontSize: 11, color: '#0f766e', marginTop: 2 }}>
                  Scale: {factor}×
                </div>
              </div>
            );
          }
        },
        {
          title: 'Scaled Ingredients Preview',
          key: 'ingredients_summary',
          width: 210,
          render: (_, record) => {
            const currentVol = customVolumes[record.id] !== undefined ? customVolumes[record.id] : globalVolumeGal;
            const factor = currentVol / (record.original_volume_gal || 5.0);
            const totalMaltLb = (record.malts || []).reduce(
              (acc, m) => acc + (m.original_amount_lb !== undefined ? m.original_amount_lb : m.amount_lb) * factor,
              0
            );
            const totalHopOz = (record.hops || []).reduce(
              (acc, h) => acc + (h.original_amount_oz !== undefined ? h.original_amount_oz : h.amount_oz) * factor,
              0
            );
            return (
              <div style={{ fontSize: 12 }}>
                <div>
                  <strong>{(record.malts || []).length} Malts:</strong>{' '}
                  <span className="mono">
                    {unitSystem === 'IMPERIAL'
                      ? `${totalMaltLb.toFixed(2)} lb`
                      : `${(totalMaltLb * 0.453592).toFixed(2)} kg`}
                  </span>
                </div>
                <div>
                  <strong>{(record.hops || []).length} Hop add.:</strong>{' '}
                  <span className="mono">
                    {unitSystem === 'IMPERIAL'
                      ? `${totalHopOz.toFixed(2)} oz`
                      : `${(totalHopOz * 28.3495).toFixed(1)} g`}
                  </span>
                </div>
                <div style={{ color: '#64748b', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 195 }}>
                  <strong>Yeast:</strong> {record.yeasts?.[0]?.strain_name || 'Standard Ale'}
                </div>
              </div>
            );
          }
        },
        {
          title: 'Recipe',
          key: 'action',
          width: 85,
          align: 'center',
          render: (_, record) => (
            <Button size="small" onClick={() => setActiveRecipe(record)}>
              Sheet
            </Button>
          )
        }
      ];

      return (
        <ConfigProvider theme={coseTheme}>
          <div>
            {/* Top CoSE Navigation & Global Batch Scaling Bar */}
            <header className="cose-header no-print">
              <div style={{ maxWidth: 1560, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                  <div style={{
                    width: 42, height: 42, borderRadius: 6,
                    background: 'rgba(13, 148, 136, 0.28)',
                    border: '1px solid #2dd4bf',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontWeight: 700, fontSize: 18, color: '#5eead4'
                  }} className="mono">
                    5G
                  </div>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-0.02em' }}>
                        CoSE BrewLab
                      </span>
                      <Tag color="#0f766e" style={{ border: '1px solid #2dd4bf', margin: 0 }}>
                        ALL-GRAIN DB
                      </Tag>
                    </div>
                    <div style={{ fontSize: 12, color: '#cbd5e1', marginTop: 2 }}>
                      BrewersFriend Recipe Database • Dynamic Volume Normalizer & Multi-Batch Ingredient Ordering
                    </div>
                  </div>
                </div>

                {/* Global Volume Controls & Unit Switcher */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>

                          return (
                            <tr key={m.id} style={{ borderBottom: '1px solid #f1f5f9' }}>
                              <td style={{ padding: 8, fontWeight: 600 }}>{m.name}</td>
                              <td className="mono" style={{ padding: 8, color: '#64748b' }}>{baseLb} lb</td>
                              <td className="mono" style={{ padding: 8, fontWeight: 700, color: '#0f766e' }}>
                                {(baseLb * factor).toFixed(2)} lb
                              </td>
                              <td className="mono" style={{ padding: 8 }}>
                                {(baseLb * factor * 0.453592).toFixed(2)} kg
                              </td>
                              <td style={{ padding: 8 }}>{m.color_srm ? `${m.color_srm} °L` : '—'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>

                    <h4 style={{ margin: '12px 0 6px', color: '#0f2342' }}>Hop Additions Schedule</h4>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, marginBottom: 16 }}>
                      <thead>
                        <tr style={{ background: '#f1f5f9', textAlign: 'left' }}>
                          <th style={{ padding: 8 }}>Variety</th>
                          <th style={{ padding: 8 }}>Original</th>
                          <th style={{ padding: 8 }}>Scaled ({targetVol}g)</th>
                          <th style={{ padding: 8 }}>Use & Time</th>
                          <th style={{ padding: 8 }}>Alpha Acid</th>
                        </tr>
                      </thead>
                      <tbody>
                        {(activeRecipe.hops || []).map((h) => {
                          const baseOz = h.original_amount_oz !== undefined ? h.original_amount_oz : h.amount_oz;
                          return (
                            <tr key={h.id} style={{ borderBottom: '1px solid #f1f5f9' }}>
                              <td style={{ padding: 8, fontWeight: 600 }}>{h.name}</td>
                              <td className="mono" style={{ padding: 8, color: '#64748b' }}>{baseOz} oz</td>
                              <td className="mono" style={{ padding: 8, fontWeight: 700, color: '#0f766e' }}>
                                {(baseOz * factor).toFixed(2)} oz ({(baseOz * factor * 28.3495).toFixed(1)} g)
                              </td>
                              <td style={{ padding: 8 }}>{h.use} ({h.time_display || `${h.addition_time_min} min`})</td>
                              <td style={{ padding: 8 }}>{h.alpha_acid ? `${h.alpha_acid}%` : '—'}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>

                    <h4 style={{ margin: '12px 0 6px', color: '#0f2342' }}>Yeast</h4>
                    <div style={{ padding: '8px 12px', background: '#f8fafc', borderRadius: 6, border: '1px solid #e2e8f0' }}>
                      {(activeRecipe.yeasts || []).map((y) => (
                        <div key={y.id} style={{ display: 'flex', justifyContent: 'space-between' }}>
                          <strong>{y.strain_name}</strong>
                          <span className="mono">
                            {Math.max(1, Math.round(factor))} pack(s) {y.attenuation_pct ? `• ${y.attenuation_pct}% Attenuation` : ''}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </Modal>

            {/* Add Custom Recipe Modal */}
            <Modal
              open={addModalOpen}
              onCancel={() => setAddModalOpen(false)}
              title="Add Custom All-Grain Recipe"
              onOk={() => form.submit()}
              okText="Save & Select Recipe"
              width={620}
            >
              <Form
                form={form}
                layout="vertical"
                initialValues={{ original_volume_gal: 5.0, style: 'American IPA', yeast: 'SafAle US-05' }}
                onFinish={handleAddCustomRecipe}
              >
                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: 12 }}>
                  <Form.Item name="name" label="Recipe Name" rules={[{ required: true }]}>
                    <Input placeholder="e.g. West Coast Centennial IPA" />
                  </Form.Item>
                  <Form.Item name="style" label="Beer Style">
                    <Input placeholder="American IPA" />
                  </Form.Item>
                  <Form.Item name="original_volume_gal" label="Base Batch (Gal)" rules={[{ required: true }]}>
                    <InputNumber min={1} max={100} step={0.5} style={{ width: '100%' }} />
                  </Form.Item>
                </div>
                <Form.Item
                  name="malts_text"
                  label="Fermentables (One per line: Name, Weight in lb, Color SRM)"
                  initialValue={"American - Pale 2-Row, 11.0, 2\nAmerican - Caramel / Crystal 40L, 0.75, 40"}
                >
                  <Input.TextArea rows={3} className="mono" />
                </Form.Item>
                <Form.Item
                  name="hops_text"
                  label="Hops (One per line: Variety, Weight in oz, Use, Time, Alpha Acid %)"
                  initialValue={"Centennial, 1.0, Boil, 60 min, 10.0\nCitra, 2.0, Dry Hop, 5 days, 12.5"}
                >
                  <Input.TextArea rows={3} className="mono" />
                </Form.Item>
                <Form.Item name="yeast" label="Yeast Strain">
                  <Input placeholder="Fermentis - Safale - American Ale Yeast US-05" />
                </Form.Item>
              </Form>
            </Modal>
          </div>
        </ConfigProvider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
